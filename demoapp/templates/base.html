{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конференции.РФ</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header>
        <div class="logo">Конференции.РФ</div>
        <nav>
            <a href="/">Главная</a>
            <a href="/create">Создать заявку</a>
            {% if user.is_authenticated %}

            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button>Выход</button>
            </form>

            {% else %}

            <a href="/accounts/login">Войти</a>
            <a href="/register">Регистрация</a>
            {% endif %}
        </nav>
    </header>
    <main>

    
        {% block content%}

        {% endblock content%}
    </main>
<footer>
    Подвал сайта 2026
</footer>
</body>
</html>
